name: Deploy unified reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "oil/index.html"
      - "oil/assets/**"
      - "oil/data/report-index.json"
      - "oil/data/reports/**"
      - "oil/reports/**"
      - "shared/**"
      - "tools/assemble_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - "Daily Energy Dashboard - Daily Data Pipeline"
      - "F-Issue Report"
      - "Backfill Article Body Summaries"
      - "Backfill Dashboard Reports"
    types: [completed]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and verify Daily report index
        run: |
          python scripts/generate_report_index.py
          python - <<'PY'
          import glob
          import json
          docs = json.load(open("docs/report-index.json", encoding="utf-8"))
          public = json.load(open("public/report-index.json", encoding="utf-8"))
          expected = len(glob.glob("data/reports/*.report.json"))
          assert docs == public
          assert docs["count"] == len(docs["availableDates"]) == len(docs["reports"]) == expected
          print(f"[OK] Daily index verified: {expected} reports")
          PY
      - name: Assemble unified site
        run: python tools/assemble_site.py
      - name: Verify unified site contents and oil relative paths
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          site = Path("_site").resolve()
          oil = site / "oil"
          daily_reports = sorted((site / "reports").glob("*.html"))
          oil_reports = sorted((oil / "reports").glob("*.html"))
          oil_data_reports = sorted((oil / "data" / "reports").glob("*.json"))
          oil_index = json.loads((oil / "data" / "report-index.json").read_text(encoding="utf-8"))

          expected_daily = {p.name.replace('.report.json', '.html') for p in Path('data/reports').glob('*.report.json')}
          expected_oil_html = {item['html_path'] for item in oil_index}
          expected_oil_json = {item['json_path'] for item in oil_index}
          assert expected_daily and {p.name for p in daily_reports} == expected_daily
          assert oil_index and len(expected_oil_html) == len(expected_oil_json) == len(oil_index)
          assert {p.relative_to(oil).as_posix() for p in oil_reports} == expected_oil_html
          assert {p.relative_to(oil).as_posix() for p in oil_data_reports} == expected_oil_json

          class References(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {"href", "src"} and value:
                          self.values.append(value)

          checked = 0
          for html_path in [oil / "index.html", *oil_reports]:
              parser = References()
              parser.feed(html_path.read_text(encoding="utf-8"))
              for value in parser.values:
                  parsed = urlsplit(value)
                  if parsed.scheme or parsed.netloc or value.startswith(("#", "/", "mailto:", "javascript:", "data:")):
                      continue
                  relative = unquote(parsed.path)
                  if not relative:
                      continue
                  target = (html_path.parent / relative).resolve()
                  assert target == site or site in target.parents, (html_path, value)
                  assert target.exists(), (html_path, value, target)
                  checked += 1

          for relative in ("assets/css/style.css", "assets/js/app.js", "data/report-index.json"):
              assert (oil / relative).is_file(), relative

          print(f"[OK] Unified artifact verified: Daily={len(daily_reports)}, oil HTML={len(oil_reports)}, oil JSON={len(oil_data_reports)}")
          print(f"[OK] Oil relative paths verified: {checked} local references")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
